schema: spec-driven

context: |
  # OpenStock — 项目上下文

  ## 项目定位
  OpenStock 是一个开源（AGPL-3.0）的免费市场数据平台，旨在替代昂贵的商业行情产品。
  提供实时股价追踪、个性化告警和公司详情查询。非券商，市场数据可能受提供商规则延迟。
  社区共建，永久免费。

  ## 技术栈
  - **运行时**: Node.js 20+, pnpm（推荐）或 npm
  - **框架**: Next.js 15 (App Router), React 19, TypeScript strict
  - **样式**: Tailwind CSS v4 (`@tailwindcss/postcss`), 无 `tailwind.config.ts`
  - **组件库**: shadcn/ui new-york 风格, Radix UI 底层原语, Lucide 图标
  - **认证**: Better Auth（邮箱/密码）+ MongoDB adapter
  - **数据库**: MongoDB + Mongoose（自定义 DNS: 8.8.8.8，强制 IPv4，见 `database/mongoose.ts`）
  - **行情数据**: Finnhub API（`NEXT_PUBLIC_FINNHUB_API_KEY` 暴露给浏览器端）
  - **图表**: TradingView 嵌入式 widget（`components/TradingViewWidget.tsx`）
  - **后台任务**: Inngest（`lib/inngest/`），通过 `app/api/inngest/route.ts` 提供服务
  - **AI**: 多 Provider 自动回退（`lib/ai-provider.ts`）
    主 Provider: Gemini (Gemini 2.5 Flash Lite)。回退链: Gemini → MiniMax → Siray。
    由 `AI_PROVIDER` 环境变量控制（默认 "gemini"），支持 "gemini"、"minimax"、"siray"。
  - **邮件**: Nodemailer（Gmail SMTP）处理事务邮件 + Kit（ConvertKit v3/v4）处理广播推送
  - **测试**: Vitest（globals 模式: `vi`, `describe`, `it`, `expect`），Node 环境（非 jsdom）
  - **代码检查**: ESLint flat config (`eslint.config.mjs`)，规则集 `next/core-web-vitals` + `next/typescript`

  ## 架构约定
  - **Server Actions**: `'use server'` 文件位于 `lib/actions/`，由页面/组件直接 import 调用。
    Finnhub/Adanos/Watchlist 数据不走 API route 层。
  - **Auth**: 单例模式，通过顶层 await 初始化: `export const auth = await getAuth()`，位于 `lib/better-auth/auth.ts`。
  - **中间件**: 位于 `middleware/index.ts`（注意 NOT 根目录 `middleware.ts`）。使用 Better Auth 的 `getSessionCookie`。
    保护范围排除: `sign-in`、`sign-up`、`forgot-password`、`reset-password`、`api`、`_next/*`、`assets/*`。
  - **类型定义**: 全局类型声明在 `types/global.d.ts`，无需显式 import 即可在任意文件中使用。
  - **构建配置**: `next.config.ts` 中关闭了构建时的 lint（`eslint.ignoreDuringBuilds: true`）和类型检查（`typescript.ignoreBuildErrors: true`）。
    构建不会因 lint 或类型错误而失败。`devIndicators: false`。
  - **路径别名**: `@/` 映射到项目根目录（tsconfig paths + vitest alias 均已配置）。
  - **组件约定**: shadcn/ui 别名定义在 `components.json` 中:
    `@/components/ui`、`@/lib/utils`、`@/hooks`、`@/components`。

  ## Provider 扩展架构（新增 — 设计中）
  OpenStock 采用可插拔的 Provider 模式，在不修改上游源码的前提下支持多种数据源:

  ```
  lib/providers/
    core/          — 接口定义 (MarketDataProvider, SentimentProvider, TradingCalendarProvider)
                     + registry.ts（注册/获取模式，环境变量驱动）
    market/        — 市场行情 Provider 实现
                     finnhub/  （默认美股，通过 Adapter 包装 finnhub.actions）
                     tushare/  （A股生产环境，REST API）
                     stock-sdk/（A股研究/备选，npm 零依赖）
    sentiment/     — 情绪分析 Provider 实现
                     adanos/   （默认: Reddit / X / News / Polymarket）
                     gjzq/     （A股: 国金证券情绪脉冲指数）
    calendar/      — 交易日历实现
                     us/ashare
  ```
  - **Provider 选择**: 环境变量 `MARKET_DATA_PROVIDER`、`SENTIMENT_PROVIDER`、`CALENDAR_PROVIDER`。
  - **多市场自动路由**: `getMarketProviderForSymbol()` 根据股票代码格式自动选择 Provider。
    例如 `600519.SH` → Tushare, `AAPL` → Finnhub。
  - **核心原则**: 仅在 `lib/providers/` 中新增文件。严禁修改 `lib/actions/`、`components/`、`app/`、`lib/inngest/`
    中的任何现有源文件，确保与上游仓库的合并兼容性。

  ## 数据源与集成
  - **Finnhub**: base URL 硬编码在 `finnhub.actions.ts` 中（未从环境变量读取）。
    缓存策略: profiles 24h, news 5min, search 30min。
  - **Adanos**: 情绪分析 API 地址 `api.adanos.org`（`ADANOS_API_KEY`, `ADANOS_API_BASE_URL`）。
    四个源通道: `/reddit/stocks/v1/compare`、`/x/stocks/v1/compare`、
    `/news/stocks/v1/compare`、`/polymarket/stocks/v1/compare`。
  - **TradingView**: 客户端 iframe widget，非服务端数据。需要进行符号格式转换:
    `formatSymbolForTradingView()` 位于 `lib/utils.ts`，将 Finnhub 点后缀 → TradingView 冒号前缀
    （例如 `2330.TW` → `TWSE:2330`）。A 股需新增映射（`600519.SH` → `SSE:600519`）。
  - **Inngest**: 本地开发需要**单独进程**运行: `npx inngest-cli@latest dev`。
    注册流程触发 `app/user.created` 事件——若 Inngest 未运行，AI 欢迎邮件不会发送但注册仍成功。
  - **Kit (ConvertKit)**: 混合 v3/v4 API，实现见 `lib/kit.ts`。注意: `API_DOCS.md` 中记录的端点
    与实际 `lib/kit.ts` 的实现不一致——始终以代码为准，非文档。
  - **AI Provider**: `callAIProviderWithFallback()` 位于 `lib/ai-provider.ts`。各 Provider 均返回纯文本。
    Gemini 使用自定义 REST 格式；MiniMax/Siray 使用 OpenAI-compatible 格式。

  ## 测试与验证
  - `pnpm test` 运行全部 vitest 测试。测试文件: `__tests__/*.test.ts`。
  - `pnpm test:db` 验证 MongoDB 连接——需要在 `.env` 中配置 `MONGODB_URI`。
  - 无 CI 工作流，仅有 `.github/FUNDING.yml`。
  - 测试中通过 `vi.stubGlobal()` 模拟 `fetch`（参见 `ai-provider.test.ts`）。
  - 无专用 fixture 目录。

  ## 环境变量（关键）
  - `.gitignore` 使用 `.env*` 规则——所有 .env 文件均被忽略（包括 `.env.example` 也不提交）。
  - `NEXT_PUBLIC_FINNHUB_API_KEY` 暴露给客户端，注意频率限制。
  - `INNGEST_SIGNING_KEY` 在 Vercel 部署时必须配置。
  - Docker 启动顺序: `docker compose up -d mongodb && docker compose up -d --build`（串行，非并行）。

  ## 目录速查（仅关键目录）
  | `app/(auth)/`        | 登录、注册、忘记/重置密码页面 |
  | `app/(root)/`        | 需认证页面: 仪表盘、stocks/[symbol]、搜索、自选列表 |
  | `components/ui/`     | shadcn/Radix 基础组件 |
  | `components/forms/`  | InputField、SelectField、CountrySelectField |
  | `database/models/`   | Mongoose schema: `watchlist.model.ts`、`alert.model.ts` |
  | `lib/actions/`       | Server actions（auth, finnhub, adanos, watchlist, user, alert） |
  | `lib/inngest/`       | client.ts, functions.ts, prompts.ts |
  | `lib/better-auth/`   | `auth.ts` — Auth 单例 |
  | `lib/nodemailer/`    | 邮件发送器、模板、重置密码 |
  | `lib/providers/`     | Provider 扩展系统（新增） |
  | `types/global.d.ts`  | 全局类型声明（无需 import） |
  | `scripts/`           | 工具脚本（test-db, Kit 迁移等） |
  | `__tests__/`         | Vitest 测试文件 |

  ## 关键符号格式
  - 美股: `AAPL`（纯 ticker）
  - Finnhub 全球: `2330.TW`（点号后缀交易所代码）
  - TradingView: `TWSE:2330`（冒号前缀交易所代码）
  - Tushare/中文: `600519.SH`、`000001.SZ`（点号后缀加交易所）
  - 配色主题: 默认暗色（根布局中 `<html lang="en" className="dark">`）
  - Inngest cron 语法: `0 9 * * 1`（每周一 9AM），`*/5 * * * *`（每 5 分钟），`0 10 * * *`（每日 10AM）

rules:
  proposal:
    - '保持提案简洁（1-2 页），聚焦"为什么做"而非"怎么做"。'
    - '每个提案必须包含 "Capabilities" 章节，列出新增/修改的 specs。'
    - '若变更涉及数据源，须注明影响哪些 Provider。'
    - '用 **BREAKING** 标记不兼容变更。'
    - '涉及 auth、数据库 schema 或数据源的变更必须包含回滚方案。'
    - '根据 context 中的目录速查表标明受影响的目录。'

  specs:
    - '规范性需求使用 SHALL/MUST（避免 should/may）。'
    - '每条需求至少包含一个场景，使用 "#### Scenario:"（4 个井号）。'
    - '场景必须使用 WHEN/THEN 格式。'
    - 'Provider 相关 spec 需定义接口契约（输入/输出类型）。'
    - '创建 delta spec 前，先查阅 openspec/specs/ 中已有的 spec。'
    - 'MODIFIED 需求必须包含完整的更新后需求块（不能只写差异部分）。'

  design:
    - '必须包含 "Decisions" 章节，说明技术选型理由（为什么选 X 而非 Y？）以及考虑过的替代方案。'
    - 'Provider 相关设计需包含依赖关系图，展示 Provider 链。'
    - '新增数据源集成需文档化数据格式映射（源格式 -> 标准格式）。'
    - '必须包含 "Risks / Trade-offs" 章节，格式: [风险] -> 缓解措施。'
    - '若设计引入新的 npm 依赖，必须论证其必要性和与现有方案相比的优势。'
    - '参考 context 中的 "Provider 扩展架构" 章节，遵循既有设计模式。'
    - '明确标注哪些文件是 NEW（新增）还是 MODIFIED（修改）。优先新增文件，避免与上游的合并冲突。'

  tasks:
    - '将任务拆分为单次可完成的粒度（每个任务不超过 2 小时）。'
    - '任务按编号分组，使用 "## N. 组名" 作为分组标题。'
    - '每个任务必须使用 checkbox 格式: "- [ ] N.M 任务描述"。'
    - '按依赖关系排序：先搭建/安装、再核心逻辑、最后验证。'
    - 'Provider 实现需同时测试环境变量设置和未设置两种情况。'
    - '包含 "验证" 任务组: 运行 pnpm test、pnpm lint，确认无回归。'
    - '新增文件时，若架构有显著变化，添加任务更新 AGENTS.md。'
    - '严禁包含修改 lib/actions/finnhub.actions.ts、lib/actions/adanos.actions.ts 或其他上游源文件的任务。新增 Provider 必须纯增量方式。'

